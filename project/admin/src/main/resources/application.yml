# ========================================
# 应用主配置
# ========================================

server:
  port: 8080                                              # 服务端口

spring:
  application:
    name: meta-build                                      # 应用名称

  datasource:                                             # 数据源配置（MySQL）
    url: jdbc:mysql://123.56.117.17:3306/meta_build?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: aliyun
    password: aliyun
    driver-class-name: com.mysql.cj.jdbc.Driver

  data:
    redis:                                                # Redis 配置
      host: 123.56.117.17
      port: 6379

mybatis-plus:                                             # MyBatis-Plus 配置
  global-config:
    db-config:
      id-type: auto                                       # 主键策略：自增
  configuration:
    map-underscore-to-camel-case: true                    # 下划线转驼峰映射
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # SQL 日志输出

# ========================================
# Actuator 监控
# ========================================

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers,mappings     # 开放端点
  endpoint:
    health:
      show-details: always                                # 显示详细健康信息
  metrics:
    export:
      enabled: false                                       # 不启用外部 metrics 导出

# ========================================
# 监控阈值配置
# ========================================

monitor:
  slow-sql:
    threshold-ms: 2000          # 慢SQL阈值(毫秒)，超过此值才记录到数据库
  api-timing:
    threshold-ms: 2000           # 接口耗时阈值(毫秒)，超过此值才记录到数据库

jwt:                                                      # JWT 令牌配置
  secret: MetaBuildSecretKey2026VeryLongSecretKeyForHS512Algorithm!!  # 签名密钥
  expiration: 86400000                                    # 过期时间（毫秒，24小时）
